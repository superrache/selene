<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sélène app icon: a coral drop on the app background.
  Same 108×108 grid as the Android adaptive icon (safe zone: circle of radius 33 around the centre);
  the Android version lives in app/src/main/res/drawable/ic_launcher_foreground.xml.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="#15121C"/>
  <!-- Drop -->
  <path fill="#FF7A6B" d="M54,29 C50,36 37,49 37,61 A17,17 0 0 0 71,61 C71,49 58,36 54,29 Z"/>
  <!-- Highlight -->
  <path fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"
        d="M44,61 A10,10 0 0 0 50,70"/>
</svg>
